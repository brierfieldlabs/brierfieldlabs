name: Public GitHub metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1" # Weekly Monday, 08:17 UTC

permissions:
  contents: write # Only to commit the generated SVG to this profile repo

concurrency:
  group: public-profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Explain missing read-only token
        if: env.METRICS_TOKEN == ''
        run: |
          echo "Metrics are not enabled yet: add the repository secret METRICS_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          echo "See docs/metrics-setup.md for public-only, no-scope token instructions." >> "$GITHUB_STEP_SUMMARY"

      - name: Render public profile metrics
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          user: brierfieldlabs
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: github-metrics.svg
          output_action: commit
          base: header, repositories
          repositories_affiliations: owner
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_indepth: no
          config_timezone: Europe/London
